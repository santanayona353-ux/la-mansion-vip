
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LA MANSIÓN VIP</title>
<style>
body{margin:0;background:#090909;color:white;font-family:Arial;text-align:center}
header{padding:25px;background:#17130b;border-bottom:2px solid #d6b45c}
h1,h2{color:#e4c875}
main{padding:18px;max-width:600px;margin:auto}
.card{background:#191919;border:1px solid #c5a34d;border-radius:14px;padding:14px;margin:14px 0;display:flex;align-items:center;gap:12px}
.photo{width:85px;height:85px;object-fit:cover;border-radius:12px;background:#333}
.name{flex:1;text-align:left;font-weight:bold}
.controls{display:flex;align-items:center;gap:8px}
button{background:#d6b45c;border:0;padding:12px;border-radius:8px;font-weight:bold}
.controls button{padding:9px 13px}
#remaining{color:#e4c875;font-size:28px}
.action{width:100%;margin-top:14px}
</style>
</head>
<body>
<header>
<div style="font-size:35px">♛</div>
<h1>LA MANSIÓN VIP</h1>
<p>VOTACIONES OFICIALES</p>
</header>
<main>
<h2>¡VOTA POR TUS FAVORITOS!</h2>
<p>Votos disponibles:</p>
<div id="remaining">10</div>
<div id="nominees"></div>
<button class="action" onclick="advertisement()">▶ VER ANUNCIO · +10 VOTOS</button>
<button class="action" onclick="sendVotes()">ENVIAR VOTOS</button>
<p id="message"></p>
<p style="color:#aaa;font-size:12px">Los resultados son privados.</p>
</main>
<script>
let votes=[0,0,0,0,0,0];
let limit=10;

const nominees=[
{name:"MANGO",photo:"file_000000002eb481f5872c87a203ca615b.png"},
{name:"PAPAYA",photo:"file_000000008ff481f59b7a1529b006b441.png"},
{name:"DURAZNO",photo:"file_000000006cb881f5af375a084f7388bd.png"},
{name:"CIRUELA",photo:"file_0000000053b881f58a5eec528e051765.png"},
{name:"LIMÓN",photo:"file_000000003c6081f5ac2a4c10782289d2.png"},
{name:"PLÁTANO",photo:"file_0000000024dc81f59456d19eded90eb0.png"}
];

function draw(){
let html="";
nominees.forEach((person,i)=>{
html+=`
<div class="card">
<img class="photo" src="${person.photo}" alt="${person.name}">
<div class="name">${person.name}</div>
<div class="controls">
<button onclick="change(${i},-1)">−</button>
<b>${votes[i]}</b>
<button onclick="change(${i},1)">+</button>
</div>
</div>`;
});
document.getElementById("nominees").innerHTML=html;
document.getElementById("remaining").textContent=
limit-votes.reduce((a,b)=>a+b,0);
}

function change(i,n){
let total=votes.reduce((a,b)=>a+b,0);
if(n>0&&total<limit)votes[i]++;
if(n<0&&votes[i]>0)votes[i]--;
draw();
}

function advertisement(){
document.getElementById("message").textContent=
"Los anuncios todavía no están conectados.";
}

function sendVotes(){
let total=votes.reduce((a,b)=>a+b,0);
document.getElementById("message").textContent=
total>0?"¡Tu selección está lista! Falta conectar el servidor para guardar los votos.":"Primero selecciona tus votos.";
}
draw();
</script>
</body>
</html>
